    <main>
        <section class="game">
            <img id="pter" src="minigames/media/pter-pixel.jpg">
        </section>
    </main>


    <footer>
        <div></div>
    </footer>

<script>

const pter = document.getElementById("pter");
const speed = 1;
const jumpHeight = 50;
const jumpMaxCooldown = 2000;

let y = -700;
let jumpCooldown = 0;

function process() {
    if (y < 0) {
        y++;
    }

    if (jumpCooldown > 0) {
        jumpCooldown--;
    }
        
    pter.style.transform = `translateY(${y}px)`;
}

const timerId = setInterval(process, 10);

window.addEventListener("keypress", (event) => {
    console.log(event.key)
    if (event.key == " ") {
        if (jumpCooldown == 0) {
            y -= jumpHeight;
            jumpCooldown = jumpMaxCooldown;
        }
    }
})

</script>
